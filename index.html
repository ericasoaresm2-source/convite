<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uma perguntinha 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TELA 1 -->
    <div class="tela ativa" id="tela1">

        <div class="card">

            <img src="cama.png.jpeg" class="imagem-cama">

            <h1>Quer vir na minha casa?</h1>

            <p>Pensa direitinho... 🥺</p>

            <div class="botoes">

                <button class="principal" id="sim">
                    Sim!
                </button>

                <button id="nao">
                    Não
                </button>

            </div>

        </div>

    </div>


    <!-- TELA 2 -->
    <div class="tela" id="tela2">

        <div class="card">

<img src="catioro.jpeg" class="imagem-catioro">

            <h1>OBAAAA!</h1>

            <p>
                Eu sabia que você ia aceitar! 😝
            </p>

            <button class="principal" id="continuar1">
                Escolher a data 📅
            </button>

        </div>

    </div>


    <!-- TELA 3 -->
    <div class="tela" id="tela3">

        <div class="card">

   <img src="catioro2.jpeg" class="imagem-catioro2">

            <h1>Quando você vem?</h1>

            <p>
                Escolha a data pra ficar agarradinho 
            </p>

            <input type="date" id="data">

            <button class="principal" id="continuar2">
                Confirmar data ✅
            </button>

        </div>

    </div>



   <!-- TELA 4 -->
<div class="tela" id="tela4">

    <div class="card">

        <img src="love.jpeg" class="imagem-love">

        <h1>Encontro marcado, gatinho!</h1>

        <p id="dataEscolhida"></p>

        <p>
            Agora é só esperar o nosso momento!
        </p>

        <button class="principal" id="whatsapp">
            Confirmar pelo WhatsApp 💌
        </button>

        <button id="continuar3">
            Continuar
        </button>

    </div>

</div>


<!-- TELA 5 -->
<div class="tela" id="tela5">

    <div class="card">

        <img src="uiui.jpeg" class="imagem-uiui">

        <h1>Te espero, meu amor! </h1>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
